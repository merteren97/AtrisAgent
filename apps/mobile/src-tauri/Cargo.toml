[package]
name = "atris-agent-mobile"
version = "0.1.0"
description = "AtrisAgent mobile companion"
authors = ["AtrisHub"]
edition = "2021"

[lib]
name = "atris_agent_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
keyring-core = "1.0.0"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.1", default-features = false, features = ["protected"] }
