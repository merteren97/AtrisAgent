name: Mobile CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Build Android release APK (test signing key)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ''
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android
      - run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - run: npm ci --include=dev --include=optional --no-audit --no-fund
      - run: node --test .github/scripts/prepare-mobile-android-signing.test.mjs
      - run: npm run tauri -w @atris-agent-code/mobile -- android init --ci
      - name: Test generated release signing without production secrets
        env:
          ANDROID_KEY_ALIAS: ci-test
          ANDROID_KEY_PASSWORD: ci-test-only
          ANDROID_KEYSTORE_PASSWORD: ci-test-only
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/ci-decoded.jks
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storepass ci-test-only -keypass ci-test-only -alias ci-test -dname "CN=CI Test Only" -keyalg RSA -validity 2
          export ANDROID_KEY_BASE64="$(base64 -w 0 "$RUNNER_TEMP/test.jks")"
          node .github/scripts/prepare-mobile-android-signing.mjs
          node .github/scripts/configure-mobile-android-signing.mjs
      - run: npm run tauri -w @atris-agent-code/mobile -- android build --ci --apk --target aarch64
      - name: Verify the built APK
        run: |
          set -euo pipefail
          mapfile -t apks < <(find apps/mobile/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "${apks[0]}"
  browser:
    name: Mobile relay and browser integration
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --include=dev --include=optional --no-audit --no-fund
      - run: npm test -w @atris-agent-code/remote && npm test -w @atris-agent-code/mobile-relay
      - run: npm run build -w @atris-agent-code/mobile && npm run build -w @atris-agent-code/mobile-relay
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w @atris-agent-code/mobile
