name: AtrisAgentCode Desktop Staging

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v0.2.0
        required: true
        type: string
      ref:
        description: Branch or commit to build
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: atris-agent-code-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

# This workflow intentionally uploads unsigned staging artifacts only. They must
# not be promoted as a release: the packaged API gateway/runtime audit and Tauri
# updater signing/public-key decision are still blocking follow-ups.
jobs:
  build:
    name: Build ${{ matrix.platform }} staging artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            bundles: nsis,msi

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact repository ref
        # v4.4.0 (reviewed immutable commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        # v4.4.0 (reviewed immutable commit)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm

      - name: Setup Rust
        # stable ref verified 2026-08-09 (reviewed immutable commit)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Install dependencies
        run: npm ci

      - name: Apply release version surfaces
        shell: bash
        run: node .github/scripts/apply-release-version.mjs "${RELEASE_TAG}"

      - name: Verify source version
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"); const v=process.env.RELEASE_TAG.replace(/^v/i, ""); if(p.version!==v) throw new Error(`root version ${p.version} != ${v}`);'

      - name: Stage packaged runtime sidecar
        run: npm run build:runtime-sidecar -w @atris-agent-code/desktop

      - name: Smoke packaged runtime sidecar
        run: npm run test:runtime-sidecar -w @atris-agent-code/desktop

      - name: Build unsigned Tauri staging bundle
        run: npm run tauri:build -w @atris-agent-code/desktop -- --bundles "${{ matrix.bundles }}"

      - name: Upload staging artifacts for review only
        # v4.6.2 (reviewed immutable commit)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atris-agent-code-staging-${{ matrix.platform }}-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
