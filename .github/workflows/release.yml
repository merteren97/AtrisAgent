name: Release AtrisAgent Desktop
run-name: Release AtrisAgent ${{ inputs.release_version }}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Enter 0.3.7 or 0.3.7-1; an optional v/V prefix is accepted"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: atris-agent-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_version }}
  RELEASE_SHA: ${{ github.sha }}

jobs:
  readiness:
    if: ${{ github.repository == 'merteren97/AtrisAgent' && github.actor == 'merteren97' && github.triggering_actor == 'merteren97' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact workflow revision
        # v4.4.0 (reviewed immutable commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Validate automatic release revision
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: node .github/scripts/release-readiness.mjs
      - name: Require successful CI for the exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking CI readiness for exact SHA $EXPECTED_SHA..."
          for i in $(seq 1 75); do
            count="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$EXPECTED_SHA&status=success&per_page=100" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length' | awk '{ total += $1 } END { print total + 0 }')"
            if [ "$count" -ge 1 ]; then
              echo "Exact SHA $EXPECTED_SHA has verified successful CI ($count runs)."
              exit 0
            fi

            active_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$EXPECTED_SHA&per_page=10" --jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting")] | length' 2>/dev/null || echo "0")"
            if [ "$active_count" -gt 0 ]; then
              echo "CI run for $EXPECTED_SHA is currently in progress ($active_count active). Waiting 20s (attempt $i/75)..."
              sleep 20
            else
              if [ "$i" -le 3 ]; then
                echo "No CI run found yet for $EXPECTED_SHA; checking for webhook dispatch lag (attempt $i/3)..."
                sleep 10
              else
                echo "No successful ci.yml run exists for exact SHA $EXPECTED_SHA"
                gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$EXPECTED_SHA&per_page=5" --jq '.workflow_runs[] | {id: .id, status: .status, conclusion: .conclusion, html_url: .html_url}' || true
                exit 1
              fi
            fi
          done
          echo "Timed out waiting for ci.yml run to complete successfully for exact SHA $EXPECTED_SHA"
          exit 1

  build:
    if: ${{ github.repository == 'merteren97/AtrisAgent' && github.actor == 'merteren97' && github.triggering_actor == 'merteren97' && github.ref == 'refs/heads/main' }}
    needs: readiness
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            releaseTarget: windows-x86_64
            rustTarget: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            releaseTarget: linux-x86_64
            rustTarget: x86_64-unknown-linux-gnu
            bundles: appimage,deb

    runs-on: ${{ matrix.os }}
    timeout-minutes: 50

    steps:
      - name: Validate and normalize requested release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[vV]?[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG"
            echo "Use 0.2.8 (stable) or 0.2.8-1 (prerelease). An optional v/V prefix is accepted."
            exit 1
          fi
          normalized_version="$RELEASE_TAG"
          if [[ "$normalized_version" == v* || "$normalized_version" == V* ]]; then
            normalized_version="${normalized_version:1}"
          fi
          normalized_tag="v$normalized_version"
          echo "RELEASE_TAG=$normalized_tag" >> "$GITHUB_ENV"
          echo "Using canonical release tag: $normalized_tag"

      - name: Checkout exact main revision
        # v4.4.0 (reviewed immutable commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        # v4.4.0 (reviewed immutable commit)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm

      - name: Setup Rust
        # stable ref verified 2026-08-09 (reviewed immutable commit)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.rustTarget }}

      - name: Restore Rust build cache
        # v2.9.2 (reviewed immutable commit)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: "./apps/desktop/src-tauri -> target"
          shared-key: release-${{ matrix.releaseTarget }}
          cache-on-failure: true

      - name: Install Linux desktop dependencies
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev \
            libxdo-dev \
            libxkbcommon-dev

      - name: Install dependencies
        run: npm ci --include=dev --include=optional --prefer-offline --no-audit --no-fund

      - name: Require updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is not configured"; exit 1; }
          test -n "$TAURI_UPDATER_PUBLIC_KEY" || { echo "TAURI_UPDATER_PUBLIC_KEY is not configured"; exit 1; }

      - name: Apply release version surfaces
        shell: bash
        run: node .github/scripts/apply-release-version.mjs "$RELEASE_TAG"

      - name: Verify source version surfaces
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const expected = process.env.RELEASE_TAG.replace(/^v/i, '');
          const root = require('./package.json').version;
          const desktop = require('./apps/desktop/package.json').version;
          const tauri = JSON.parse(fs.readFileSync('./apps/desktop/src-tauri/tauri.conf.json', 'utf8')).version;
          if (root !== expected) throw new Error(`root version ${root} != ${expected}`);
          if (desktop !== expected) throw new Error(`desktop version ${desktop} != ${expected}`);
          if (tauri !== expected) throw new Error(`tauri version ${tauri} != ${expected}`);
          NODE

      - name: Create release-only updater bundler config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/create-updater-build-config.mjs apps/desktop/src-tauri/tauri.release.conf.json
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('apps/desktop/src-tauri/tauri.release.conf.json', 'utf8'));
          if (config.bundle?.createUpdaterArtifacts !== true) throw new Error('Updater artifacts are not enabled.');
          if (!config.plugins?.updater?.pubkey) throw new Error('Updater public key is missing from the Tauri release config.');
          if (!Array.isArray(config.plugins?.updater?.endpoints) || config.plugins.updater.endpoints.length !== 1) {
            throw new Error('Updater endpoint is missing from the Tauri release config.');
          }
          console.log('Release-only Tauri updater configuration validated.');
          NODE

      - name: Stage packaged runtime sidecar
        run: npm run build:runtime-sidecar -w @atris-agent-code/desktop

      - name: Smoke packaged runtime sidecar
        run: npm run test:runtime-sidecar -w @atris-agent-code/desktop

      - name: Smoke Windows installed-layout runtime
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $sourceRuntime = (Resolve-Path 'apps/desktop/src-tauri/target/runtime').Path
          $installedRoot = Join-Path $env:RUNNER_TEMP 'Atris Agent Installed Layout'
          $installedRuntime = Join-Path $installedRoot 'runtime'
          Remove-Item $installedRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $installedRuntime -Force | Out-Null
          Copy-Item -Path (Join-Path $sourceRuntime '*') -Destination $installedRuntime -Recurse -Force
          npm run test:runtime-sidecar -w @atris-agent-code/desktop -- --runtime-dir "$installedRuntime"

      - name: Test Tauri runtime launcher
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --target "${{ matrix.rustTarget }}"

      - name: Build desktop packages and updater signatures
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: npm run tauri:build -w @atris-agent-code/desktop -- --target "${{ matrix.rustTarget }}" --bundles "${{ matrix.bundles }}" --config src-tauri/tauri.release.conf.json

      - name: Stage release artifacts
        env:
          RUST_TARGET: ${{ matrix.rustTarget }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const srcDir = path.join('apps/desktop/src-tauri/target', process.env.RUST_TARGET, 'release/bundle');
          const destDir = 'release-artifacts';
          fs.mkdirSync(destDir, { recursive: true });
          function walk(dir) {
            for (const item of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, item.name);
              if (item.isDirectory()) walk(full);
              else if (/\.(exe|msi|AppImage|deb|sig)$/i.test(item.name)) {
                fs.copyFileSync(full, path.join(destDir, item.name));
              }
            }
          }
          walk(srcDir);
          const staged = fs.readdirSync(destDir);
          if (staged.length === 0) throw new Error(`No release artifacts staged from ${srcDir}`);
          console.log(`Staged ${staged.length} release artifacts:\n${staged.join('\n')}`);
          NODE

      - name: Upload release artifacts
        # v7 (reviewed immutable commit)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atris-agent-${{ matrix.releaseTarget }}-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          path: |
            release-artifacts/*.exe
            release-artifacts/*.msi
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/*.sig

  publish:
    if: ${{ github.repository == 'merteren97/AtrisAgent' && github.actor == 'merteren97' && github.triggering_actor == 'merteren97' && github.ref == 'refs/heads/main' }}
    needs: [readiness, build]
    runs-on: ubuntu-22.04
    environment: production-release
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Validate and normalize requested release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[vV]?[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG"
            echo "Use 0.2.8 (stable) or 0.2.8-1 (prerelease). An optional v/V prefix is accepted."
            exit 1
          fi
          normalized_version="$RELEASE_TAG"
          if [[ "$normalized_version" == v* || "$normalized_version" == V* ]]; then
            normalized_version="${normalized_version:1}"
          fi
          normalized_tag="v$normalized_version"
          echo "RELEASE_TAG=$normalized_tag" >> "$GITHUB_ENV"
          echo "Using canonical release tag: $normalized_tag"

      - name: Checkout release manifest generator
        # v4.4.0 (reviewed immutable commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download verified build artifacts
        # v8 (reviewed immutable commit)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release-assets
          merge-multiple: true

      - name: Setup Node.js for local Tauri signature verification
        # v4.4.0 (reviewed immutable commit)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install locked Tauri verifier
        run: npm ci --include=dev --include=optional --prefer-offline --no-audit --no-fund

      - name: Normalize downloaded release assets
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/validate-release-assets.mjs --normalize release-assets

      - name: Enforce exact versioned artifact allowlist and record hashes
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/validate-release-assets.mjs release-assets "$RELEASE_TAG"
          cat release-assets/SHA256SUMS

      - name: Verify every updater signature with the approved public key
        # Cryptographic verification: replaces non-existent 'tauri signer verify' CLI command with native Node.js Minisign (Blake2b-512 + Ed25519) verification
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          APPROVED_UPDATER_KEY_FINGERPRINT: ${{ vars.TAURI_UPDATER_PUBLIC_KEY_FINGERPRINT || secrets.TAURI_UPDATER_PUBLIC_KEY_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_UPDATER_PUBLIC_KEY" || { echo "TAURI_UPDATER_PUBLIC_KEY is not configured"; exit 1; }
          node - <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const rawKeyInput = process.env.TAURI_UPDATER_PUBLIC_KEY.trim();
          const normalizedKeyInput = rawKeyInput.replace(/\r\n/g, '\n');
          const actualFingerprint = crypto.createHash('sha256').update(normalizedKeyInput).digest('hex').toUpperCase();
          console.log(`Tauri updater public key fingerprint: ${actualFingerprint}`);

          // Parse Minisign public key
          const pubkeyText = normalizedKeyInput.startsWith('untrusted comment:')
            ? normalizedKeyInput
            : Buffer.from(normalizedKeyInput, 'base64').toString('utf8');
          const pubkeyLines = pubkeyText.trim().split(/\r?\n/);
          if (pubkeyLines.length < 2) throw new Error('Invalid TAURI_UPDATER_PUBLIC_KEY format');
          const pubkeyBytes = Buffer.from(pubkeyLines[1].trim(), 'base64');
          if (pubkeyBytes.length !== 42) throw new Error(`Unexpected public key byte length: ${pubkeyBytes.length} (expected 42)`);
          const pubKeyId = pubkeyBytes.subarray(2, 10);
          const rawEd25519PubKey = pubkeyBytes.subarray(10);
          const rawBytesFingerprint = crypto.createHash('sha256').update(rawEd25519PubKey).digest('hex').toUpperCase();

          const expectedFingerprint = (process.env.APPROVED_UPDATER_KEY_FINGERPRINT || '').replaceAll(':', '').trim().toUpperCase();
          if (expectedFingerprint) {
            if (!/^[0-9A-F]{64}$/.test(expectedFingerprint)) throw new Error('TAURI_UPDATER_PUBLIC_KEY_FINGERPRINT must be 64 hexadecimal characters');
            const unnormalizedFingerprint = crypto.createHash('sha256').update(rawKeyInput).digest('hex').toUpperCase();
            if (actualFingerprint !== expectedFingerprint && unnormalizedFingerprint !== expectedFingerprint && rawBytesFingerprint !== expectedFingerprint) {
              throw new Error(`Configured updater public key fingerprint ${actualFingerprint} does not match approved ${expectedFingerprint}`);
            }
            console.log(`Approved updater public key fingerprint verified: ${expectedFingerprint}`);
          }
          const spkiPrefix = Buffer.from('302a300506032b6570032100', 'hex');
          const cryptoPubKey = crypto.createPublicKey({
            key: Buffer.concat([spkiPrefix, rawEd25519PubKey]),
            format: 'der',
            type: 'spki'
          });

          // Cryptographically verify every updater signature pair
          const assetsDir = 'release-assets';
          const files = fs.readdirSync(assetsDir);
          const packages = files.filter(f => /\.(exe|msi|AppImage|deb)$/i.test(f));
          if (packages.length === 0) throw new Error('No release packages found in release-assets to verify');

          let verifiedCount = 0;
          for (const pkg of packages) {
            const pkgPath = path.join(assetsDir, pkg);
            const sigPath = `${pkgPath}.sig`;
            if (!fs.existsSync(sigPath)) throw new Error(`Missing updater signature: ${sigPath}`);
            const sigContent = fs.readFileSync(sigPath, 'utf8').trim();
            const sigText = sigContent.startsWith('untrusted comment:')
              ? sigContent
              : Buffer.from(sigContent, 'base64').toString('utf8');
            const sigLines = sigText.trim().split(/\r?\n/);
            if (sigLines.length < 2) throw new Error(`Malformed signature file: ${sigPath}`);
            const sigBytes = Buffer.from(sigLines[1].trim(), 'base64');
            if (sigBytes.length !== 74) throw new Error(`Unexpected signature byte length: ${sigBytes.length} in ${sigPath}`);
            const sigKeyId = sigBytes.subarray(2, 10);
            if (!sigKeyId.equals(pubKeyId)) {
              throw new Error(`Signature key ID mismatch for ${pkg}: ${sigKeyId.toString('hex')} != ${pubKeyId.toString('hex')}`);
            }
            const ed25519Sig = sigBytes.subarray(10);
            const fileData = fs.readFileSync(pkgPath);
            const blakeHash = crypto.createHash('blake2b512').update(fileData).digest();
            const isValid = crypto.verify(null, blakeHash, cryptoPubKey, ed25519Sig);
            if (!isValid) throw new Error(`Cryptographic signature verification failed for ${pkg}`);
            console.log(`[PASS] Cryptographically verified updater signature for: ${pkg}`);
            verifiedCount++;
          }
          console.log(`Successfully verified all ${verifiedCount} desktop release packages with public key ID ${pubKeyId.toString('hex')}`);
          NODE

      - name: Generate stable updater manifest
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            node .github/scripts/generate-updater-manifest.mjs release-assets "$GITHUB_REPOSITORY" "$RELEASE_TAG"
            test -s release-assets/latest.json
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            FLAGS+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; immutable publication refuses replacement"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; immutable publication requires a new version"
            exit 1
          fi

          mapfile -d '' RELEASE_ASSETS < <(find release-assets -maxdepth 1 -type f -print0)
          expected_count=9
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then expected_count=10; fi
          test "${#RELEASE_ASSETS[@]}" -eq "$expected_count"
          gh release create "$RELEASE_TAG" "${RELEASE_ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "AtrisAgent $RELEASE_TAG" \
            --generate-notes \
            "${FLAGS[@]}"

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          expected_count=9
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then expected_count=10; fi
          for attempt in $(seq 1 6); do
            ASSETS="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            count="$(grep -c . <<< "$ASSETS" || echo "0")"
            if [ "$count" -ge "$expected_count" ]; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Timed out waiting for all $expected_count release assets via GitHub API (found $count)"
              break
            fi
            echo "Waiting for GitHub API asset indexing: found $count/$expected_count (attempt $attempt/6)..."
            sleep 3
          done
          test "$(wc -l <<< "$ASSETS")" -eq "$expected_count"
          grep -Eiq '\.(exe|msi)$' <<< "$ASSETS"
          grep -Eiq '\.AppImage$' <<< "$ASSETS"
          grep -Eiq '\.deb$' <<< "$ASSETS"
          grep -Eiq '\.sig$' <<< "$ASSETS"
          grep -Fxq 'SHA256SUMS' <<< "$ASSETS"
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            grep -Fxq 'latest.json' <<< "$ASSETS"
          fi
