name: Release AtrisAgent Desktop
run-name: Release AtrisAgent ${{ inputs.release_version }}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Enter v0.2.1-1 (prerelease) or v0.2.1 (stable); v/V prefix is accepted"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: true
        type: boolean
      expected_sha:
        description: "Exact 40-character main commit SHA already accepted and validated by CI"
        required: true
        type: string
      packaged_clean_install:
        description: "Packaged clean install accepted on supported production platforms"
        required: true
        default: false
        type: boolean
      updater_round_trip:
        description: "Signed updater install and rollback/round-trip accepted"
        required: true
        default: false
        type: boolean
      production_entitlement:
        description: "Production authentication and entitlement accepted"
        required: true
        default: false
        type: boolean
      interactive_visual_keyboard:
        description: "Interactive visual, theme, constrained-window, and keyboard acceptance completed"
        required: true
        default: false
        type: boolean
      signing_key_decision:
        description: "Explicit production updater signing-key decision"
        required: true
        type: choice
        options:
          - rotate-before-release
          - approved-production-key
      signing_key_fingerprint:
        description: "Approved updater public key SHA-256 fingerprint (64 hex characters)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: atris-agent-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_version }}
  MANUAL_PRERELEASE: ${{ inputs.prerelease }}

jobs:
  readiness:
    if: ${{ github.repository == 'merteren97/AtrisAgent' && github.actor == 'merteren97' && github.triggering_actor == 'merteren97' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact accepted revision
        # v4.4.0 (reviewed immutable commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Require exact revision and explicit release acceptances
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACCEPT_PACKAGED_CLEAN_INSTALL: ${{ inputs.packaged_clean_install }}
          ACCEPT_UPDATER_ROUND_TRIP: ${{ inputs.updater_round_trip }}
          ACCEPT_PRODUCTION_ENTITLEMENT: ${{ inputs.production_entitlement }}
          ACCEPT_INTERACTIVE_VISUAL_KEYBOARD: ${{ inputs.interactive_visual_keyboard }}
          SIGNING_KEY_DECISION: ${{ inputs.signing_key_decision }}
          SIGNING_KEY_FINGERPRINT: ${{ inputs.signing_key_fingerprint }}
        run: node .github/scripts/release-readiness.mjs
      - name: Require successful CI for the exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$EXPECTED_SHA&status=success&per_page=100" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length' | awk '{ total += $1 } END { print total + 0 }')"
          test "$count" -ge 1 || { echo "No successful ci.yml run exists for exact SHA $EXPECTED_SHA"; exit 1; }

  build:
    if: ${{ github.repository == 'merteren97/AtrisAgent' && github.actor == 'merteren97' && github.triggering_actor == 'merteren97' && github.ref == 'refs/heads/main' }}
    needs: readiness
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            releaseTarget: windows-x86_64
            rustTarget: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            releaseTarget: linux-x86_64
            rustTarget: x86_64-unknown-linux-gnu
            bundles: appimage,deb

    runs-on: ${{ matrix.os }}
    timeout-minutes: 50

    steps:
      - name: Validate and normalize requested release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG"
            echo "Use v0.2.8 (stable) or v0.2.8-1 (prerelease). The V prefix is case-insensitive."
            exit 1
          fi
          normalized_tag="v${RELEASE_TAG:1}"
          echo "RELEASE_TAG=$normalized_tag" >> "$GITHUB_ENV"
          echo "Using canonical release tag: $normalized_tag"

      - name: Checkout exact main revision
        # v4.4.0 (reviewed immutable commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        # v4.4.0 (reviewed immutable commit)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm

      - name: Setup Rust
        # stable ref verified 2026-08-09 (reviewed immutable commit)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.rustTarget }}

      - name: Restore Rust build cache
        # v2.9.2 (reviewed immutable commit)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: "./apps/desktop/src-tauri -> target"
          shared-key: release-${{ matrix.releaseTarget }}
          cache-on-failure: true

      - name: Install Linux desktop dependencies
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev \
            libxdo-dev \
            libxkbcommon-dev

      - name: Install dependencies
        run: npm ci --include=dev --include=optional --prefer-offline --no-audit --no-fund

      - name: Require updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is not configured"; exit 1; }
          test -n "$TAURI_UPDATER_PUBLIC_KEY" || { echo "TAURI_UPDATER_PUBLIC_KEY is not configured"; exit 1; }

      - name: Apply release version surfaces
        shell: bash
        run: node .github/scripts/apply-release-version.mjs "$RELEASE_TAG"

      - name: Verify source version surfaces
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const expected = process.env.RELEASE_TAG.replace(/^v/i, '');
          const root = require('./package.json').version;
          const desktop = require('./apps/desktop/package.json').version;
          const tauri = JSON.parse(fs.readFileSync('./apps/desktop/src-tauri/tauri.conf.json', 'utf8')).version;
          if (root !== expected) throw new Error(`root version ${root} != ${expected}`);
          if (desktop !== expected) throw new Error(`desktop version ${desktop} != ${expected}`);
          if (tauri !== expected) throw new Error(`tauri version ${tauri} != ${expected}`);
          NODE

      - name: Create release-only updater bundler config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/create-updater-build-config.mjs apps/desktop/src-tauri/tauri.release.conf.json
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('apps/desktop/src-tauri/tauri.release.conf.json', 'utf8'));
          if (config.bundle?.createUpdaterArtifacts !== true) throw new Error('Updater artifacts are not enabled.');
          if (!config.plugins?.updater?.pubkey) throw new Error('Updater public key is missing from the Tauri release config.');
          if (!Array.isArray(config.plugins?.updater?.endpoints) || config.plugins.updater.endpoints.length !== 1) {
            throw new Error('Updater endpoint is missing from the Tauri release config.');
          }
          console.log('Release-only Tauri updater configuration validated.');
          NODE

      - name: Stage packaged runtime sidecar
        run: npm run build:runtime-sidecar -w @atris-agent-code/desktop

      - name: Smoke packaged runtime sidecar
        run: npm run test:runtime-sidecar -w @atris-agent-code/desktop

      - name: Smoke Windows installed-layout runtime
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $sourceRuntime = (Resolve-Path 'apps/desktop/src-tauri/target/runtime').Path
          $installedRoot = Join-Path $env:RUNNER_TEMP 'Atris Agent Installed Layout'
          $installedRuntime = Join-Path $installedRoot 'runtime'
          Remove-Item $installedRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $installedRuntime -Force | Out-Null
          Copy-Item -Path (Join-Path $sourceRuntime '*') -Destination $installedRuntime -Recurse -Force
          npm run test:runtime-sidecar -w @atris-agent-code/desktop -- --runtime-dir "$installedRuntime"

      - name: Test Tauri runtime launcher
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --target "${{ matrix.rustTarget }}"

      - name: Build desktop packages and updater signatures
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: npm run tauri:build -w @atris-agent-code/desktop -- --target "${{ matrix.rustTarget }}" --bundles "${{ matrix.bundles }}" --config src-tauri/tauri.release.conf.json

      - name: Upload release artifacts
        # v7 (reviewed immutable commit)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atris-agent-${{ matrix.releaseTarget }}-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.sig

  publish:
    if: ${{ github.repository == 'merteren97/AtrisAgent' && github.actor == 'merteren97' && github.triggering_actor == 'merteren97' && github.ref == 'refs/heads/main' }}
    needs: [readiness, build]
    runs-on: ubuntu-22.04
    environment: production-release
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Validate and normalize requested release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG"
            exit 1
          fi
          normalized_tag="v${RELEASE_TAG:1}"
          echo "RELEASE_TAG=$normalized_tag" >> "$GITHUB_ENV"
          echo "Using canonical release tag: $normalized_tag"

      - name: Checkout release manifest generator
        # v4.4.0 (reviewed immutable commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download verified build artifacts
        # v8 (reviewed immutable commit)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release-assets
          merge-multiple: true

      - name: Setup Node.js for local Tauri signature verification
        # v4.4.0 (reviewed immutable commit)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install locked Tauri verifier
        run: npm ci --include=dev --include=optional --prefer-offline --no-audit --no-fund

      - name: Enforce exact versioned artifact allowlist and record hashes
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/validate-release-assets.mjs release-assets "$RELEASE_TAG"
          cat release-assets/SHA256SUMS

      - name: Verify every updater signature with the approved public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          SIGNING_KEY_FINGERPRINT: ${{ inputs.signing_key_fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_UPDATER_PUBLIC_KEY" || { echo "TAURI_UPDATER_PUBLIC_KEY is not configured"; exit 1; }
          node - <<'NODE'
          const crypto = require('node:crypto');
          const actual = crypto.createHash('sha256').update(process.env.TAURI_UPDATER_PUBLIC_KEY.trim()).digest('hex').toUpperCase();
          const expected = process.env.SIGNING_KEY_FINGERPRINT.replaceAll(':', '').toUpperCase();
          if (actual !== expected) throw new Error(`Configured updater public key fingerprint ${actual} does not match approved ${expected}`);
          console.log(`Approved updater public key fingerprint verified: ${actual}`);
          NODE
          while IFS= read -r -d '' package; do
            test -s "$package.sig"
            npx --no-install tauri signer verify -k "$TAURI_UPDATER_PUBLIC_KEY" "$package.sig" "$package"
          done < <(find release-assets -maxdepth 1 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' \) -print0)

      - name: Generate stable updater manifest
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MANUAL_PRERELEASE" != "true" && "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            node .github/scripts/generate-updater-manifest.mjs release-assets "$GITHUB_REPOSITORY" "$RELEASE_TAG"
            test -s release-assets/latest.json
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$MANUAL_PRERELEASE" == "true" || ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            FLAGS+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; immutable publication refuses replacement"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; immutable publication requires a new version"
            exit 1
          fi

          mapfile -d '' RELEASE_ASSETS < <(find release-assets -maxdepth 1 -type f -print0)
          expected_count=9
          if [[ "$MANUAL_PRERELEASE" != "true" && "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then expected_count=10; fi
          test "${#RELEASE_ASSETS[@]}" -eq "$expected_count"
          gh release create "$RELEASE_TAG" "${RELEASE_ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ inputs.expected_sha }}" \
            --title "AtrisAgent $RELEASE_TAG" \
            --generate-notes \
            "${FLAGS[@]}"

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          expected_count=9
          if [[ "$MANUAL_PRERELEASE" != "true" && "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then expected_count=10; fi
          ASSETS="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          test "$(wc -l <<< "$ASSETS")" -eq "$expected_count"
          grep -Eiq '\.(exe|msi)$' <<< "$ASSETS"
          grep -Eiq '\.AppImage$' <<< "$ASSETS"
          grep -Eiq '\.deb$' <<< "$ASSETS"
          grep -Eiq '\.sig$' <<< "$ASSETS"
          grep -Fxq 'SHA256SUMS' <<< "$ASSETS"
          if [[ "$MANUAL_PRERELEASE" != "true" && "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            grep -Fxq 'latest.json' <<< "$ASSETS"
          fi
