name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, tests and desktop + landing builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        # v4.4.0 (reviewed immutable commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        # v4.4.0 (reviewed immutable commit)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository quality gate
        run: npm run check

      - name: Typecheck landing and build public static site
        # `npm run check` already executes all workspace tests, including the
        # public-server regression suite. Keep this step to the missing landing
        # typecheck and static export/build-site contract instead of rerunning tests.
        run: npm run typecheck -w @atris-agent-code/landing && npm run build:landing

  windows-runtime-regression:
    name: Windows CLI, Tauri shell and routing regressions
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        # v4.4.0 (reviewed immutable commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        # v4.4.0 (reviewed immutable commit)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        # stable ref verified 2026-08-09 (reviewed immutable commit)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Install dependencies
        run: npm ci

      - name: Check Tauri Rust shell
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Typecheck runtime host
        run: npm run typecheck -w @atris-agent-code/runtime-host

      - name: Run runtime host regressions
        run: npm run test -w @atris-agent-code/runtime-host

      - name: Validate workflow security contracts
        run: node --test .github/scripts/workflow-security-contract.test.mjs
