name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, tests and web builds
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        # v4.4.0 (reviewed immutable commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node.js
        # v4.4.0 (reviewed immutable commit)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --include=optional --prefer-offline --no-audit --no-fund

      - name: Run repository quality gate
        run: npm run check

      - name: Typecheck landing and build public static site
        # `npm run check` already executes all workspace tests, including the
        # public-server regression suite. Keep this step to the missing landing
        # typecheck and static export/build-site contract instead of rerunning tests.
        run: npm run typecheck -w @atris-agent-code/landing && npm run build:landing

      - name: Validate workflow security contracts
        run: node --test .github/scripts/workflow-security-contract.test.mjs

  native-runtime-regression:
    name: Native runtime regression (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            rustTarget: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            platform: linux-x86_64
            rustTarget: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        # v4.4.0 (reviewed immutable commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node.js
        # v4.4.0 (reviewed immutable commit)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm

      - name: Setup Rust
        # stable ref verified 2026-08-09 (reviewed immutable commit)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.rustTarget }}

      - name: Install Linux desktop dependencies
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev \
            libxdo-dev \
            libxkbcommon-dev

      - name: Install dependencies
        run: npm ci --include=dev --include=optional --prefer-offline --no-audit --no-fund

      - name: Stage packaged runtime sidecar
        run: npm run build:runtime-sidecar -w @atris-agent-code/desktop

      - name: Smoke packaged runtime sidecar
        run: npm run test:runtime-sidecar -w @atris-agent-code/desktop

      - name: Check Tauri Rust shell
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --target "${{ matrix.rustTarget }}"

      - name: Typecheck runtime host
        run: npm run typecheck -w @atris-agent-code/runtime-host

      - name: Run runtime host regressions
        run: npm run test -w @atris-agent-code/runtime-host
